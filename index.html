<!doctype html>
<html lang="en">

<head>
  <script src="/gtag.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <title>Digital Invitations | JLC Solutions</title>
  <meta name="description" content="Beautiful digital invitations you can personalise, pay with GCash and share with one link — plus IT consulting, custom software and networks from JLC Solutions." />
  <style>
    /* Loading screen: shown by index.html until the app mounts, and by the app (SiteLoader) while site data loads. */
    .jlc-loader { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; background: #fbf7f0; color: #2b2420; font-family: Inter, ui-sans-serif, system-ui, sans-serif; text-align: center; animation: jlc-fade-in .5s ease both; }
    .jlc-loader-mark { position: relative; width: 92px; height: 92px; }
    .jlc-loader-ring { position: absolute; inset: 0; width: 100%; height: 100%; animation: jlc-spin 2.6s cubic-bezier(.5,.1,.5,.9) infinite; }
    .jlc-loader-core { position: absolute; inset: 15px; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: #1f3d2b; color: #fff; box-shadow: 0 1px 2px rgb(60 40 10 / .08), 0 6px 16px rgb(60 40 10 / .14); animation: jlc-breathe 2.6s ease-in-out infinite; }
    .jlc-loader-core svg { width: 26px; height: 26px; }
    .jlc-loader-name { margin: 22px 0 0; font-family: "Cormorant Garamond", Georgia, "Times New Roman", serif; font-size: 30px; font-weight: 600; line-height: 1.1; }
    .jlc-loader-tag { margin: 8px 0 0; font-size: 11px; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; color: #1f3d2b; }
    .jlc-loader-bar { position: relative; width: 132px; height: 2px; margin-top: 22px; overflow: hidden; border-radius: 2px; background: #e7dcc7; }
    .jlc-loader-bar::after { content: ""; position: absolute; inset: 0; width: 40%; border-radius: 2px; background: #a8843f; animation: jlc-slide 1.6s ease-in-out infinite; }
    @keyframes jlc-fade-in { from { opacity: 0; } to { opacity: 1; } }
    @keyframes jlc-spin { to { transform: rotate(360deg); } }
    @keyframes jlc-breathe { 50% { transform: scale(.96); } }
    @keyframes jlc-slide { from { transform: translateX(-110%); } to { transform: translateX(260%); } }
    @media (prefers-reduced-motion: reduce) { .jlc-loader, .jlc-loader-ring, .jlc-loader-core, .jlc-loader-bar::after { animation: none; } .jlc-loader-bar::after { left: 30%; } }
  </style>
</head>

<body>
  <div id="root">
    <div class="jlc-loader" role="status" aria-live="polite">
      <div class="jlc-loader-mark" aria-hidden="true">
        <svg class="jlc-loader-ring" viewBox="0 0 92 92" fill="none"><circle cx="46" cy="46" r="44" stroke="#e7dcc7" stroke-width="1.5" /><circle cx="46" cy="46" r="44" stroke="#a8843f" stroke-width="2" stroke-linecap="round" stroke-dasharray="70 207" /></svg>
        <span class="jlc-loader-core"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.49 12H2" /></svg></span>
      </div>
      <p class="jlc-loader-name">JLC Solutions</p>
      <p class="jlc-loader-tag">Preparing your page</p>
      <span class="jlc-loader-bar" aria-hidden="true"></span>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
